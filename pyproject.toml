[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-trie-lm"
version = "0.1.0"
description = "Experiments with structural word fingerprints and context tries"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dustin Wann"}]

[project.scripts]
structural-trie = "structural_trie.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
